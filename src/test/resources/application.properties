# Configuration for the test suite only. It must never contain a real credential:
# everything sensitive comes from the environment, with local-only defaults.
#
# The @SpringBootTest tests need a throwaway MySQL schema. Create one with
#   CREATE DATABASE inatrace_test;
# and export INATRACE_TEST_DB_USER / INATRACE_TEST_DB_PASSWORD if yours is not
# the usual local root account. Pure unit tests (GeoDataParserTest,
# KoboExportReaderTest, FarmerImportTemplateAssetTest) need none of this.

INATrace.env = TEST
spring.main.banner-mode = off
server.port = 0

INATrace.database.name = ${INATRACE_TEST_DB_NAME:inatrace_test}
INATrace.database.hostname = ${INATRACE_TEST_DB_HOST:localhost}
INATrace.database.port = ${INATRACE_TEST_DB_PORT:3306}

spring.datasource.url = jdbc:mysql://${INATrace.database.hostname}:${INATrace.database.port}/${INATrace.database.name}?autoReconnect=true&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
spring.datasource.driver-class-name = com.mysql.cj.jdbc.Driver
spring.datasource.username = ${INATRACE_TEST_DB_USER:root}
spring.datasource.password = ${INATRACE_TEST_DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto = update
spring.jpa.autocommit = true
spring.jmx.enabled = false
spring.jpa.hibernate.naming.implicit-strategy = org.hibernate.boot.model.naming.ImplicitNamingStrategyComponentPathImpl
spring.jpa.hibernate.naming.physical-strategy = org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.properties.hibernate.dialect = com.abelium.inatrace.configuration.CustomMySQLDialect
spring.jpa.properties.hibernate.hbm2ddl.auto = update

spring.flyway.baseline-on-migrate = true
spring.flyway.out-of-order = true
spring.flyway.validate-on-migrate = false
spring.flyway.check-location = false
spring.flyway.table = schema_version
spring.flyway.ignore-missing-migrations = true
spring.flyway.locations = com.abelium.inatrace.db.migrations,classpath:/db/migrations

spring.jackson.serialization.write-dates-as-timestamps = false
spring.jackson.default-property-inclusion = non_null

# Mail is never sent from tests.
management.health.mail.enabled = false
spring.mail.host = localhost
spring.mail.port = 1025
INATrace.mail.sendingEnabled = false
INATrace.mail.redirect = none
INATrace.mail.template.from = tests@inatrace.invalid
INATrace.loginManager.mail = tests@inatrace.invalid
INATrace.info.mail = tests@inatrace.invalid

INATrace.auth.accessTokenCookieName = inatrace-accessToken
INATrace.auth.accessTokenExpirationSec = 3600
INATrace.auth.refreshTokenCookieName = inatrace-refreshToken
INATrace.auth.refreshTokenExpirationSec = 300
# Test-only value. Never reuse it for a deployment.
INATrace.auth.jwtSigningKey = ${INATRACE_TEST_JWT_KEY:test-only-signing-key-not-for-deployment}

INATrace.fileStorage.root = ${java.io.tmpdir}/inatrace-test/file_storage
INATrace.import.path = ${java.io.tmpdir}/inatrace-test/import/
INATrace.documents.root = ${java.io.tmpdir}/inatrace-test/documents/

INATrace.emailConfirmation.url = http://localhost:4200/confirm-email/
INATrace.passwordReset.url = http://localhost:4200/reset-password/
INATrace.fe.url = http://localhost:4200

# No third-party integration is exercised by the tests.
INATrace.requestLog.token = none
INAtrace.exchangerate.apiKey = none
beyco.oauth2.clientId = none
beyco.oauth2.clientSecret = none
beyco.oauth2.url = none
beyco.integration.url = none
INATrace.agstack.apiKey = none
INATrace.agstack.clientSecret = none
INATrace.agstack.baseURL = none
